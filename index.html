<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murotal Player — Juz 30</title>
<meta name="description" content="Beautiful Murotal Audio Player for the last 10 surahs of Juz 30 Al-Quran">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-primary: #0a0e1a;
    --bg-card: rgba(255,255,255,0.04);
    --bg-card-hover: rgba(255,255,255,0.07);
    --bg-active: rgba(34,197,94,0.08);
    --border: rgba(255,255,255,0.06);
    --border-active: rgba(34,197,94,0.25);
    --text-primary: #e8eaf0;
    --text-secondary: #8b92a8;
    --text-muted: #555d75;
    --accent: #22c55e;
    --accent-glow: rgba(34,197,94,0.3);
    --gold: #d4a847;
    --progress-bg: rgba(255,255,255,0.06);
    --progress-fill: #22c55e;
    --btn-hover: rgba(255,255,255,0.1);
    --radius: 14px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(34,197,94,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(212,168,71,0.03) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 24px 16px 100px; }

  /* Header */
  .header { text-align: center; padding: 32px 0 28px; }
  .header-icon {
    width: 64px; height: 64px; margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--accent), #16a34a);
    border-radius: 18px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px var(--accent-glow);
    animation: pulse-glow 3s ease-in-out infinite;
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 8px 24px var(--accent-glow); }
    50% { box-shadow: 0 8px 36px rgba(34,197,94,0.45); }
  }
  .header-icon svg { width: 32px; height: 32px; fill: white; }
  .header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
  .header p { color: var(--text-secondary); font-size: 0.85rem; }
  .arabic-title { font-family: 'Amiri', serif; font-size: 1.3rem; color: var(--gold); margin-bottom: 8px; direction: rtl; }

  /* Controls */
  .controls { display: flex; gap: 10px; margin-bottom: 20px; }
  .btn-control {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg-card); color: var(--text-primary); cursor: pointer;
    font-family: inherit; font-size: 0.85rem; font-weight: 500;
    transition: all 0.25s ease; backdrop-filter: blur(8px);
  }
  .btn-control:hover { background: var(--btn-hover); border-color: rgba(255,255,255,0.12); transform: translateY(-1px); }
  .btn-control.active { background: var(--bg-active); border-color: var(--border-active); color: var(--accent); }
  .btn-control svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }

  /* Surah List */
  .surah-list { display: flex; flex-direction: column; gap: 8px; }
  .surah-item {
    display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px;
    padding: 14px 16px; border-radius: var(--radius);
    background: var(--bg-card); border: 1px solid var(--border);
    transition: all 0.3s ease; cursor: default;
    backdrop-filter: blur(8px);
  }
  .surah-item:hover { background: var(--bg-card-hover); border-color: rgba(255,255,255,0.1); transform: translateY(-1px); box-shadow: var(--shadow); }
  .surah-item.playing {
    background: var(--bg-active); border-color: var(--border-active);
    box-shadow: 0 0 0 1px var(--border-active), 0 8px 32px rgba(34,197,94,0.1);
  }

  .surah-number {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);
    border: 1.5px solid var(--border); border-radius: 12px;
    background: rgba(255,255,255,0.02); position: relative;
  }
  .surah-item.playing .surah-number { border-color: var(--accent); color: var(--accent); background: rgba(34,197,94,0.08); }

  /* Equalizer animation */
  .equalizer { display: none; gap: 2px; align-items: flex-end; height: 16px; }
  .surah-item.playing .equalizer { display: flex; }
  .surah-item.playing .num-text { display: none; }
  .eq-bar {
    width: 3px; background: var(--accent); border-radius: 2px;
    animation: eq 0.8s ease-in-out infinite alternate;
  }
  .eq-bar:nth-child(1) { height: 6px; animation-delay: 0s; }
  .eq-bar:nth-child(2) { height: 12px; animation-delay: 0.2s; }
  .eq-bar:nth-child(3) { height: 8px; animation-delay: 0.4s; }
  .eq-bar:nth-child(4) { height: 14px; animation-delay: 0.1s; }
  @keyframes eq {
    0% { transform: scaleY(0.3); }
    100% { transform: scaleY(1); }
  }
  .surah-item.paused .eq-bar { animation-play-state: paused; }

  .surah-info { min-width: 0; }
  .surah-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .surah-arabic { font-family: 'Amiri', serif; color: var(--gold); font-size: 0.85rem; float: right; margin-left: 8px; }
  .surah-meta { color: var(--text-secondary); font-size: 0.75rem; }
  .surah-item.playing .surah-name { color: var(--accent); }

  /* Progress bar */
  .progress-wrap {
    grid-column: 1 / -1; margin-top: 6px;
    display: none; align-items: center; gap: 8px;
  }
  .surah-item.playing .progress-wrap, .surah-item.paused .progress-wrap { display: flex; }
  .progress-bar {
    flex: 1; height: 4px; background: var(--progress-bg);
    border-radius: 4px; overflow: hidden; cursor: pointer; position: relative;
  }
  .progress-bar:hover { height: 6px; }
  .progress-fill {
    height: 100%; width: 0%; border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), #4ade80);
    transition: width 0.15s linear;
  }
  .time { font-size: 0.7rem; color: var(--text-muted); font-variant-numeric: tabular-nums; min-width: 32px; }

  /* Action buttons */
  .surah-actions { display: flex; gap: 6px; }
  .btn-icon {
    width: 38px; height: 38px; border: none; border-radius: 10px;
    background: transparent; color: var(--text-secondary);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  .btn-icon:hover { background: var(--btn-hover); color: var(--text-primary); transform: scale(1.08); }
  .btn-icon svg { width: 18px; height: 18px; fill: currentColor; }
  .btn-play { color: var(--accent); }
  .btn-play:hover { background: rgba(34,197,94,0.12); color: var(--accent); }
  .surah-item.playing .btn-play, .surah-item.paused .btn-play { color: var(--accent); }

  /* Responsive */
  @media (max-width: 480px) {
    .app { padding: 16px 12px 100px; }
    .header h1 { font-size: 1.35rem; }
    .surah-item { grid-template-columns: 38px 1fr auto; gap: 10px; padding: 12px; }
    .surah-number { width: 38px; height: 38px; font-size: 0.75rem; border-radius: 10px; }
    .btn-icon { width: 34px; height: 34px; }
    .surah-name { font-size: 0.88rem; }
  }

  /* Scroll fade */
  .surah-item { animation: fadeUp 0.4s ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>
    <div class="arabic-title">القرآن الكريم</div>
    <h1>Murotal Player</h1>
    <p>Last 10 Surahs — Juz 30</p>
  </header>

  <div class="controls">
    <button class="btn-control" id="btnPlayAll" onclick="togglePlayAll()">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      <span>Play All</span>
    </button>
    <button class="btn-control" id="btnShuffle" onclick="toggleShuffle()">
      <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      <span>Shuffle</span>
    </button>
  </div>

  <div class="surah-list" id="surahList"></div>
</div>

<script>
const surahs = [
  { number: 114, name: "An-Nas", arabic: "الناس", meaning: "Mankind", verses: 6 },
  { number: 113, name: "Al-Falaq", arabic: "الفلق", meaning: "The Dawn", verses: 5 },
  { number: 112, name: "Al-Ikhlas", arabic: "الإخلاص", meaning: "Sincerity", verses: 4 },
  { number: 111, name: "Al-Lahab", arabic: "المسد", meaning: "The Flame", verses: 5 },
  { number: 110, name: "An-Nasr", arabic: "النصر", meaning: "The Help", verses: 3 },
  { number: 109, name: "Al-Kafirun", arabic: "الكافرون", meaning: "The Disbelievers", verses: 6 },
  { number: 108, name: "Al-Kautsar", arabic: "الكوثر", meaning: "Abundance", verses: 3 },
  { number: 107, name: "Al-Ma'un", arabic: "الماعون", meaning: "Small Kindness", verses: 7 },
  { number: 106, name: "Quraisy", arabic: "قريش", meaning: "Quraysh", verses: 4 },
  { number: 105, name: "Al-Fil", arabic: "الفيل", meaning: "The Elephant", verses: 5 }
];

let currentIndex = -1;
let isPlayAll = false;
let isShuffle = false;
let audios = {};

// Mishary Rashid Alafasy — via islamic.network CDN
function getAudioUrl(s) { return `https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${s.number}.mp3`; }

function formatTime(s) {
  if (isNaN(s)) return "0:00";
  const m = Math.floor(s / 60);
  return m + ":" + String(Math.floor(s % 60)).padStart(2, '0');
}

function renderList() {
  const list = document.getElementById('surahList');
  list.innerHTML = surahs.map((s, i) => `
    <div class="surah-item" id="item-${i}" style="animation-delay:${i * 0.05}s">
      <div class="surah-number">
        <span class="num-text">${s.number}</span>
        <div class="equalizer"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div>
      </div>
      <div class="surah-info">
        <div class="surah-name"><span class="surah-arabic">${s.arabic}</span>${s.name}</div>
        <div class="surah-meta">Surah ${s.number} · ${s.verses} Ayat · ${s.meaning}</div>
      </div>
      <div class="surah-actions">
        <button class="btn-icon btn-play" onclick="togglePlay(${i})" title="Play" aria-label="Play ${s.name}" id="playBtn-${i}">
          <svg viewBox="0 0 24 24" class="icon-play"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" class="icon-pause" style="display:none"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
        </button>
        <button class="btn-icon" onclick="downloadAudio(${i})" title="Download" aria-label="Download ${s.name}" id="dlBtn-${i}">
          <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        </button>
      </div>
      <div class="progress-wrap">
        <span class="time" id="cur-${i}">0:00</span>
        <div class="progress-bar" onclick="seek(event,${i})" id="pbar-${i}">
          <div class="progress-fill" id="pfill-${i}"></div>
        </div>
        <span class="time" id="dur-${i}">0:00</span>
      </div>
    </div>
  `).join('');
}

function getAudio(i) {
  if (!audios[i]) {
    const a = new Audio(getAudioUrl(surahs[i]));
    a.preload = 'metadata';
    a.addEventListener('timeupdate', () => {
      const fill = document.getElementById('pfill-' + i);
      const cur = document.getElementById('cur-' + i);
      if (fill && a.duration) fill.style.width = (a.currentTime / a.duration * 100) + '%';
      if (cur) cur.textContent = formatTime(a.currentTime);
    });
    a.addEventListener('loadedmetadata', () => {
      const dur = document.getElementById('dur-' + i);
      if (dur) dur.textContent = formatTime(a.duration);
    });
    a.addEventListener('ended', () => {
      clearPlaying(i);
      if (isPlayAll) playNext(i);
    });
    audios[i] = a;
  }
  return audios[i];
}

function clearPlaying(i) {
  const el = document.getElementById('item-' + i);
  if (el) { el.classList.remove('playing'); el.classList.remove('paused'); }
  const playIcon = document.querySelector('#playBtn-' + i + ' .icon-play');
  const pauseIcon = document.querySelector('#playBtn-' + i + ' .icon-pause');
  if (playIcon) playIcon.style.display = '';
  if (pauseIcon) pauseIcon.style.display = 'none';
}

function stopAll() {
  Object.keys(audios).forEach(k => { audios[k].pause(); clearPlaying(parseInt(k)); });
}

function togglePlay(i) {
  const audio = getAudio(i);
  if (currentIndex === i && !audio.paused) {
    audio.pause();
    document.getElementById('item-' + i).classList.add('paused');
    document.getElementById('item-' + i).classList.remove('playing');
    document.querySelector('#playBtn-' + i + ' .icon-play').style.display = '';
    document.querySelector('#playBtn-' + i + ' .icon-pause').style.display = 'none';
    return;
  }
  if (currentIndex !== i) { stopAll(); currentIndex = i; }
  const el = document.getElementById('item-' + i);
  el.classList.add('playing');
  el.classList.remove('paused');
  document.querySelector('#playBtn-' + i + ' .icon-play').style.display = 'none';
  document.querySelector('#playBtn-' + i + ' .icon-pause').style.display = '';
  audio.play().catch(() => {});
}

function seek(e, i) {
  const audio = getAudio(i);
  if (!audio.duration) return;
  const bar = document.getElementById('pbar-' + i);
  const rect = bar.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
}

function playNext(fromIndex) {
  let next;
  if (isShuffle) {
    next = Math.floor(Math.random() * surahs.length);
    if (next === fromIndex && surahs.length > 1) next = (next + 1) % surahs.length;
  } else {
    next = fromIndex + 1;
  }
  if (next < surahs.length) togglePlay(next);
  else {
    isPlayAll = false;
    document.getElementById('btnPlayAll').classList.remove('active');
  }
}

function togglePlayAll() {
  isPlayAll = !isPlayAll;
  document.getElementById('btnPlayAll').classList.toggle('active', isPlayAll);
  if (isPlayAll && currentIndex === -1) togglePlay(0);
}

function toggleShuffle() {
  isShuffle = !isShuffle;
  document.getElementById('btnShuffle').classList.toggle('active', isShuffle);
}

async function downloadAudio(i) {
  const s = surahs[i];
  const url = getAudioUrl(s);
  const btn = document.getElementById('dlBtn-' + i);
  btn.style.opacity = '0.5';
  btn.style.pointerEvents = 'none';
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${String(s.number).padStart(3,'0')}_${s.name}.mp3`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  } catch (e) {
    alert('Download gagal. Coba lagi.');
  }
  btn.style.opacity = '';
  btn.style.pointerEvents = '';
}

renderList();
</script>
</body>
</html>
